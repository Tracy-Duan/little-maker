<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf9f5" />
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <title>小小造物家 · 和小芽聊聊</title>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#chat" aria-label="小小造物家首页"><img src="/assets/mascot.webp" alt="" />小小造物家</a>
    <nav class="top-nav" aria-label="主导航">
      <a href="#chat" data-section="chat" aria-current="page"><i data-lucide="message-circle"></i>聊天</a>
      <a href="#make" data-section="make"><i data-lucide="wand-sparkles"></i>制作</a>
      <a href="#works" data-section="works"><i data-lucide="folder-heart"></i>作品<span id="count" hidden></span></a>
    </nav>
  </header>

  <main class="app-main">
  <img class="fairytale-art" src="/assets/fairytale-forest.webp" width="1536" height="1024" alt="" aria-hidden="true" />
  <section id="chat" class="chat-shell" aria-label="聊天">
    <button id="chatExamples" class="case-link" data-featured hidden>看看画变成了什么</button>
    <div id="conversation" class="conversation">
      <section id="welcome" class="welcome">
        <div class="orb"><img src="/assets/mascot.webp" alt="小芽" /></div>
        <h1>嗨，我是小芽</h1>
        <p>和我聊聊你的想法，或把一张画变成立体小伙伴。</p>
        <button id="openCreation" class="primary"><i data-lucide="wand-sparkles"></i>生成 3D</button>
        <button class="case-link" data-featured hidden>看看画变成了什么</button>
      </section>
      <section id="voicePanel" class="voice-panel" aria-label="语音聊天" hidden>
        <div class="orb"><img src="/assets/mascot.webp" alt="小芽" /></div>
        <div class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <p id="voiceStatus" role="status"></p>
      </section>
      <button id="olderMessages" class="small-button older-messages" type="button" hidden>查看更早的消息</button>
      <div id="messages" class="messages" role="log" aria-label="对话记录"></div>
    </div>
    <div class="composer-area">
      <div id="jobCard" class="job-card" hidden>
        <span class="job-icon"><i data-lucide="box"></i></span>
        <div>
          <strong id="jobTitle"></strong>
          <p id="jobStatus" role="status"></p>
          <div id="jobProgressRow" class="job-progress-row" hidden>
            <div id="jobProgress" class="job-progress" role="progressbar" aria-label="3D 生成进度" aria-valuemin="0" aria-valuemax="100">
              <span id="jobProgressFill" class="job-progress-fill"></span>
            </div>
            <span id="jobProgressLabel" class="job-progress-label" aria-hidden="true"></span>
          </div>
        </div>
        <button id="jobAction" class="small-button" hidden></button>
      </div>
      <details id="storyBox" hidden><summary>给作品留一句故事</summary><form id="storyForm"><label id="storyQuestion" for="storyAnswer"></label><input id="storyAnswer" maxlength="120" required placeholder="写下你的想象…"><button class="small-button">存进作品</button></form><small id="storyNotice" role="status"></small></details>
      <form id="chatForm" class="composer">
        <button id="composeCreation" class="icon-button add-button" type="button" aria-label="生成 3D" title="生成 3D" hidden><i data-lucide="box"></i></button>
        <input id="chatInput" aria-label="发给小芽的消息" placeholder="给小芽发消息" maxlength="500" autocomplete="off" />
        <button id="voice" class="icon-button voice-button" type="button" aria-label="开始语音聊天" title="开始语音聊天" aria-pressed="false"><i data-lucide="audio-lines"></i></button>
        <button id="send" class="icon-button send-button" type="submit" aria-label="发送消息" disabled><i data-lucide="arrow-up"></i></button>
      </form>
      <p id="chatNotice" class="chat-notice" role="status" hidden></p>
    </div>
  </section>

  <section id="make" class="workspace-page" aria-labelledby="creationTitle" hidden>
    <form id="creationForm" class="section-card modal-inner">
      <div class="modal-header"><h1 id="creationTitle">制作 3D 作品</h1></div>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      <button id="drop" type="button" class="upload-zone">
        <span id="uploadEmpty"><i data-lucide="image-plus"></i><strong>选择一张画作</strong><small>也可以把画作拖到这里</small></span>
        <img id="original" alt="待生成的原画，点击可更换" hidden />
      </button>
      <button id="sample" class="sample-button" type="button">试试示例画作</button>
      <label for="name">作品名字 <small>选填</small></label>
      <input id="name" maxlength="20" placeholder="比如：收集星星的小兔" />
      <label for="story">还有什么想告诉小芽？ <small>选填</small></label>
      <textarea id="story" maxlength="120" rows="2" placeholder="比如：它会把星光分给朋友"></textarea>
      <p id="error" class="error" role="alert" hidden></p>
      <p id="makeStatus" class="form-note make-status" hidden>已有作品正在生成。<a href="#chat">回聊天看进度</a></p>
      <button id="create" class="primary" type="submit" disabled><i data-lucide="wand-sparkles"></i><span id="createLabel">开始生成</span></button>
      <p class="form-note">画作会交由 AI 服务处理。生成期间可以继续聊天。</p>
    </form>
  </section>

  <section id="works" class="workspace-page" aria-labelledby="galleryTitle" hidden>
    <div class="section-card modal-inner">
      <div class="modal-header"><h1 id="galleryTitle">我的作品</h1></div>
      <button class="case-link" data-featured hidden>探索小芽的示例作品</button>
      <div id="galleryItems"></div>
    </div>
  </section>
  </main>

  <dialog id="modelDialog" class="model-dialog" aria-labelledby="resultTitle">
    <div class="modal-inner">
      <div class="modal-header"><h2 id="resultTitle">3D 作品</h2><button class="icon-button" data-close aria-label="关闭作品预览"><i data-lucide="x"></i></button></div>
      <div class="comparison"><figure id="caseDrawing" hidden><img id="caseImage" alt="对应的创作原画"><figcaption>创作原画</figcaption></figure><div id="viewer" aria-label="可旋转和缩放的 3D 模型"></div></div>
      <p id="authorStory" hidden></p><div id="caseTabs" hidden></div>
      <p id="modelStatus" class="form-note" role="status"></p>
      <div id="modelTools" class="model-tools" hidden>
        <button id="rotate" class="small-button">自动旋转</button>
        <button id="resetView" class="small-button">重置视角</button>
        <a id="downloadModel" class="small-button" download="little-maker.glb">下载 GLB</a>
        <button id="save" class="primary">收藏作品</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/src.js"></script>
</body>
</html>
